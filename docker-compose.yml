services:
  mariadb:
    image: mariadb:11.4
    container_name: pickup-xpress-mariadb
    restart: unless-stopped
    environment:
      MARIADB_USER: pickup_xpress
      MARIADB_PASSWORD: pickup_xpress
      MARIADB_DATABASE: pickup_xpress
      MARIADB_ROOT_PASSWORD: pickup_xpress_root
    ports:
      - "3306:3306"
    volumes:
      - pickup_xpress_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pickup_xpress_mariadb:
